<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Breakout Improved</title>
    <style>
        canvas {
            background: #222;
            display: block;
            margin: 0 auto;
        }
        body {
            text-align: center;
            font-family: sans-serif;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Breakout!</h1>
    <canvas id="gameCanvas" width="480" height="320"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game constants
        const paddleHeight = 10;
        const paddleWidth = 75;
        const ballRadius = 8;
        const brickRowCount = 3;
        const brickColumnCount = 5;
        const brickWidth = 75;
        const brickHeight = 20;
        const brickPadding = 10;
        const brickOffsetTop = 30;
        const brickOffsetLeft = 30;
        const brickColors = ["#FF5733", "#33FF57", "#3357FF", "#F1C40F", "#9B59B6"];

        // Game variables
        let paddleX;
        let x, y, dx, dy;
        let rightPressed = false;
        let leftPressed = false;
        let bricks = [];
        let score = 0;
        let isGameOver = false;
        let isGameWon = false;

        function initBricks() {
            bricks = [];
            for(let c=0; c<brickColumnCount; c++) {
                bricks[c] = [];
                for(let r=0; r<brickRowCount; r++) {
                    bricks[c][r] = {
                        x: 0,
                        y: 0,
                        status: 1,
                        color: brickColors[Math.floor(Math.random() * brickColors.length)]
                    };
                }
            }
        }

        function initBall() {
            x = canvas.width / 2;
            y = canvas.height - 30 - paddleHeight;
            let angle = Math.random() * Math.PI / 2 + Math.PI / 4; // 45° to 135°
            dx = 3 * Math.cos(angle);
            dy = -3 * Math.sin(angle);
        }

        function resetGame(resetScore = false) {
            if(resetScore) score = 0; // Reset only on loss
            paddleX = (canvas.width - paddleWidth) / 2;
            isGameOver = false;
            isGameWon = false;
            initBall();
            initBricks();
            draw();
        }

        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);

        function keyDownHandler(e) {
            if(isGameOver) {
                // Reset with score depending on win/loss
                resetGame(!isGameWon);
                return;
            }
            if(e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        }

        function keyUpHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function collisionDetection() {
            // Brick collisions
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    const b = bricks[c][r];
                    if(b.status === 1) {
                        if(x + ballRadius > b.x && x - ballRadius < b.x + brickWidth &&
                           y + ballRadius > b.y && y - ballRadius < b.y + brickHeight) {

                            const prevX = x - dx;
                            const prevY = y - dy;
                            if(prevY + ballRadius <= b.y || prevY - ballRadius >= b.y + brickHeight) {
                                dy = -dy;
                            } else {
                                dx = -dx;
                            }
                            b.status = 0;
                            score++;
                            if(score === brickRowCount * brickColumnCount) {
                                isGameWon = true;
                                isGameOver = true;
                            }
                        }
                    }
                }
            }

            // Paddle collision (like brick collision)
            const paddleTop = canvas.height - paddleHeight;
            if(y + ballRadius > paddleTop && y - ballRadius < paddleTop + paddleHeight &&
               x + ballRadius > paddleX && x - ballRadius < paddleX + paddleWidth) {

                const prevY = y - dy;
                if(prevY + ballRadius <= paddleTop) {
                    dy = -dy;
                    // Optional: slight angle adjustment based on hit position
                    let collidePoint = x - (paddleX + paddleWidth/2);
                    collidePoint = collidePoint / (paddleWidth/2);
                    dx += collidePoint; // tweak horizontal speed
                    y = paddleTop - ballRadius; // prevent sinking
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#00ff00";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    const b = bricks[c][r];
                    if(b.status === 1) {
                        const brickX = (c*(brickWidth + brickPadding)) + brickOffsetLeft;
                        const brickY = (r*(brickHeight + brickPadding)) + brickOffsetTop;
                        b.x = brickX;
                        b.y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = b.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function drawScore() {
            ctx.font = "16px Arial";
            ctx.fillStyle = "#fff";
            ctx.textAlign = "left";
            ctx.fillText("Score: " + score, 8, 20);
        }

        function drawGameMessage(message, color="red") {
            ctx.font = "32px Arial";
            ctx.fillStyle = color;
            ctx.textAlign = "center";
            ctx.fillText(message, canvas.width / 2, canvas.height / 2);
            ctx.font = "16px Arial";
            ctx.fillText("Press any key to restart", canvas.width / 2, canvas.height / 2 + 30);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            drawScore();

            if(isGameOver) {
                drawGameMessage(isGameWon ? "YOU WIN!" : "GAME OVER", isGameWon ? "lime" : "red");
                return;
            }

            collisionDetection();

            // Ball movement
            x += dx;
            y += dy;

            // Wall collisions
            if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
            if(y + dy < ballRadius) dy = -dy;
            else if(y + dy > canvas.height) {
                if(y + ballRadius > canvas.height) isGameOver = true;
            }

            // Paddle movement
            if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 5;
            else if(leftPressed && paddleX > 0) paddleX -= 5;

            requestAnimationFrame(draw);
        }

        // Start game
        resetGame(true);
    </script>
</body>
</html>
